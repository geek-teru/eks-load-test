# Locust の manifest。Argo CD の Application（k8s/argocd/locust.yaml）が自動で同期する
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: locust
resources:
  - namespace.yaml
  - master.yaml
  - worker.yaml
# worker の台数。初期値 5（5〜15 の範囲で変える）。kubectl scale は selfHeal で戻されるので、ここを変えて push する
replicas:
  - name: locust-worker
    count: 5
configMapGenerator:
  # シナリオ（locustfile）。scenarios/<名前>.py に1ファイル1シナリオで置き、ここにすべて並べる
  # （キー名 = ファイル名。/mnt/locust/<名前>.py にマウントされる）
  # 中身が変わると名前のハッシュが変わり、Pod が入れ替わる
  - name: locust-scenarios
    files:
      - smoke.py=scenarios/smoke.py
  # 試験の設定。master / worker に環境変数で渡す
  - name: locust-config
    literals:
      # 対象アプリの URL。シナリオにはホストを書かず、ここで差し替える
      - LOCUST_HOST=https://example.com # TODO: 対象アプリの URL（未決）
      # 使うシナリオ。切り替えはこの1行（/mnt/locust/<名前>.py）を書き換えて push するだけ
      - LOCUST_LOCUSTFILE=/mnt/locust/smoke.py
      # Web UI の初期値（ユーザー数・spawn rate）。UI で開始するときに上書きできる
      - LOCUST_USERS=10
      - LOCUST_SPAWN_RATE=1
