# Locust の manifest。Argo CD の Application（k8s/argocd/locust.yaml）が自動で同期する
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: locust
resources:
  - namespace.yaml
  - master.yaml
configMapGenerator:
  # シナリオ（locustfile）。中身が変わると名前のハッシュが変わり、Pod が入れ替わる
  - name: locust-scenarios
    files:
      - smoke.py=scenarios/smoke.py
  # 対象 URL と実行するシナリオ。LOCUST_HOST は対象アプリの URL に差し替える
  - name: locust-config
    literals:
      - LOCUST_HOST=https://example.com # TODO: 対象アプリの URL（未決）
      - LOCUST_LOCUSTFILE=/mnt/locust/smoke.py
